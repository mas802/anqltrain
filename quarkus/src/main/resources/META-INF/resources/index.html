  <script>
  (function() {
    const target = new Date('2025-12-07T18:00:00+02:00');
    const elHours = document.getElementById('countdown-hours');
    const elMinutes = document.getElementById('countdown-minutes');

    function pad(n) { return n.toString().padStart(2, '0'); }

    function tick() {
      const now = new Date();
      const diffMs = target.getTime() - now.getTime();
      if (diffMs <= 0) {
        elHours.textContent = 'noch 00 Stunden';
        elMinutes.textContent = '00 Minuten 00 Sekunden';
        clearInterval(timer);
        return;
      }
      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const prefix = days > 0 ? days + ' Tage ' : '';
      elHours.textContent = 'noch ' + prefix + pad(hours) + ' Stunden';
      elMinutes.textContent = pad(minutes) + ' Minuten ' + pad(seconds) + ' Sekunden';
    }

    tick();
    const timer = setInterval(tick, 1000);
  })();
  </script>
