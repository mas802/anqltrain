<!DOCTYPE html>
<html>

<head>
  <title>XMAS TRAIN</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<main>
<div class="wrapper">
  <div class="train box full"><xmas-start data-label="TRAIN" data-youtube="VMuNEjnc3yk"/></div>
  <div class="box full" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <div id="countdown" style="font-size:3rem;line-height:1.2;margin:0.5em 0;">
      <div id="countdown-hours">noch -- Stunden</div>
      <div id="countdown-minutes">-- Minuten -- Sekunden</div>
    </div>
    <div style="opacity:0.8;">bis zum Apero am 07.12.2025, 18:00 Uhr</div>
    <div style="opacity:0.8;">Marktgasse 42, Rheinfelden</div>
  </div>
  <div class="box halfleft">
    <a href="https://www.facebook.com/groups/1123376876449124/"><img class="imgw" src="imgs/facebook.png" title="facebook"/></a>
  </div>
  <div class="box halfright">
    <a href="https://github.com/mas802/xmas2020"><img class="imgw" src="imgs/github.jpg" title="github"/></a>
  </div>
</div>

  </main>
    <script src="app.js" type="module"></script>

  <script>
  (function() {
    const target = new Date('2025-12-07T18:00:00+02:00');
    const elHours = document.getElementById('countdown-hours');
    const elMinutes = document.getElementById('countdown-minutes');

    function pad(n) { return n.toString().padStart(2, '0'); }

    function tick() {
      const now = new Date();
      const diffMs = target.getTime() - now.getTime();
      if (diffMs <= 0) {
        elHours.textContent = 'noch 00 Stunden';
        elMinutes.textContent = '00 Minuten 00 Sekunden';
        clearInterval(timer);
        return;
      }
      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const prefix = days > 0 ? days + ' Tage ' : '';
      elHours.textContent = 'noch ' + prefix + pad(hours) + ' Stunden';
      elMinutes.textContent = pad(minutes) + ' Minuten ' + pad(seconds) + ' Sekunden';
    }

    tick();
    const timer = setInterval(tick, 1000);
  })();
  </script>
</body>
</html>
