        <!-- TODO should move AUDIO js code into the webcomponent so it is accesible here instead of main -->
<audio id="AUDIO_TRAIN" src="audio/train-crossing-short.mp3"></audio>
<audio id="AUDIO_CROSSING" src="audio/train-crossing-short.mp3"></audio>
<audio id="AUDIO_GUGGE" src="audio/gugge-short.mp3"></audio>

<audio id="AUDIO_SANTA2" src="audio/SANTA2.mp3"></audio>
<audio id="AUDIO_FIRE" src="audio/martinshorn.mp3"></audio>
<audio id="AUDIO_GHOSTBUSTERS" src="audio/ghostbuster-short2.mp3"></audio>

  <script>
const AUDIO_PREFIX = 'AUDIO_';

const componentByLabel = new Map();
document.querySelectorAll('xmas-start[data-label]').forEach(component => {
    const label = component.getAttribute('data-label');
    if (!label) {
        return;
    }
    const normalized = label.trim().toUpperCase();
    if (!componentByLabel.has(normalized)) {
        componentByLabel.set(normalized, []);
    }
    componentByLabel.get(normalized).push(component);
});

document.querySelectorAll(`audio[id^="${AUDIO_PREFIX}"]`).forEach(audio => {
    const id = audio.id || '';
    const label = id.substring(AUDIO_PREFIX.length).toUpperCase();
    const targets = componentByLabel.get(label);
    if (!targets || targets.length === 0) {
        return;
    }
    targets.forEach(target => {
      console.log("add AUDIO for: " +label);
        target.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play();
        });
    });
});
  </script>

  <script>
    (() => {
      const link = document.getElementById('plan-link');
      if (!link) {
        return;
      }
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        return;
      }
      const target = new URL(link.href);
      target.searchParams.set('token', token);
      link.href = target.toString();
    })();
  </script>
